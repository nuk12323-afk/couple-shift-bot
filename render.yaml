services:
  - type: web
    name: couple-shift-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TIMEZONE
        value: Asia/Bangkok
      - key: DAILY_REMINDER_TIME
        value: "07:30"
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: TYPHOON_API_KEY
        sync: false
      - key: TYPHOON_OCR_MODEL
        value: typhoon-ocr
      - key: TYPHOON_CHAT_MODEL
        value: typhoon-v2.5-30b-a3b-instruct
